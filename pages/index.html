<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音訊轉譯工具</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(13,110,253,.12), transparent 38rem),
        linear-gradient(225deg, rgba(25,135,84,.12), transparent 32rem),
        #f6f8fb;
    }
    .app-shell { max-width: 980px; }
    .hero-card { border: 0; box-shadow: 0 1.5rem 4rem rgba(23, 32, 51, .12); }
    .drop-zone {
      border: 2px dashed #b8c4d6;
      background: #f9fbfe;
      transition: .2s ease;
    }
    .drop-zone.dragover {
      border-color: #0d6efd;
      background: #eef5ff;
    }
    pre {
      max-height: 320px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="container app-shell py-5">
    <div class="row justify-content-center">
      <div class="col-12">
        <div class="mb-4">
          <span class="badge text-bg-primary mb-3">Audio Tool</span>
          <h1 class="display-5 fw-bold text-dark mb-3">音訊轉文字</h1>
          <p class="lead text-secondary mb-0">上傳音訊，選擇格式，完成後下載結果。</p>
        </div>

        <div class="card hero-card rounded-3">
          <div class="card-body p-4 p-lg-5">
            <form id="transcribeForm" class="needs-validation" novalidate>
              <div id="dropZone" class="drop-zone rounded-3 p-4 p-lg-5 text-center mb-4">
                <input class="form-control form-control-lg" id="audioFile" name="file" type="file" accept="audio/*,video/mp4,video/webm" required>
                <div class="form-text mt-3">支援常見音訊檔案。</div>
              </div>

              <div class="row g-3 align-items-end">
                <div class="col-md-6">
                  <label for="outputFormat" class="form-label fw-semibold">輸出格式</label>
                  <select id="outputFormat" name="output_format" class="form-select form-select-lg">
                    <option value="txt" selected>TXT 純文字</option>
                    <option value="srt">SRT 字幕</option>
                    <option value="lrc">LRC 歌詞時間軸</option>
                    <option value="json">JSON 分段資料</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="language" class="form-label fw-semibold">語言提示</label>
                  <select id="language" name="language" class="form-select form-select-lg">
                    <option value="" selected>自動偵測</option>
                    <option value="zh">中文</option>
                    <option value="en">英文</option>
                    <option value="ja">日文</option>
                    <option value="ko">韓文</option>
                  </select>
                </div>
              </div>

              <div class="d-grid d-sm-flex gap-3 mt-4">
                <button id="submitBtn" class="btn btn-primary btn-lg px-4" type="submit">
                  開始轉譯
                </button>
                <a class="btn btn-outline-secondary btn-lg px-4" href="/docs">API 文件</a>
              </div>
            </form>

            <div id="statusBox" class="alert alert-info d-none mt-4 mb-0" role="status">
              <div class="d-flex align-items-center gap-3">
                <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
                <div>
                  <strong id="statusTitle">準備中</strong>
                  <div id="statusDetail" class="small">請稍候，完成後會自動下載。</div>
                </div>
              </div>
            </div>

            <div id="resultBox" class="d-none mt-4">
              <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                <h2 class="h5 mb-0">轉譯完成</h2>
                <a id="downloadLink" class="btn btn-success" download>下載結果</a>
              </div>
              <pre id="preview" class="bg-dark text-light rounded-3 p-3 mb-0"></pre>
            </div>

            <div id="errorBox" class="alert alert-danger d-none mt-4 mb-0"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("transcribeForm");
    const fileInput = document.getElementById("audioFile");
    const dropZone = document.getElementById("dropZone");
    const statusBox = document.getElementById("statusBox");
    const resultBox = document.getElementById("resultBox");
    const errorBox = document.getElementById("errorBox");
    const preview = document.getElementById("preview");
    const downloadLink = document.getElementById("downloadLink");
    const submitBtn = document.getElementById("submitBtn");
    const statusTitle = document.getElementById("statusTitle");
    const statusDetail = document.getElementById("statusDetail");

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function setStatus(title, detail) {
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
    }

    async function readError(response, fallback) {
      try {
        const data = await response.json();
        return data.detail || fallback;
      } catch (_) {
        return fallback;
      }
    }

    async function waitForResult(requestInfo) {
      let current = requestInfo;

      while (current.status === "queued" || current.status === "running") {
        if (current.status === "queued") {
          setStatus("排程中", "已收到檔案，正在等待處理。");
        } else {
          setStatus("轉譯中", "正在處理檔案，請保持此頁開啟。");
        }

        await wait(1500);
        const response = await fetch(current.status_url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(await readError(response, "查詢狀態失敗"));
        }
        current = await response.json();
      }

      if (current.status === "failed") {
        throw new Error(current.error || "轉譯失敗");
      }
      if (current.status !== "done") {
        throw new Error("任務狀態異常");
      }
      return current;
    }

    ["dragenter", "dragover"].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });

    dropZone.addEventListener("drop", event => {
      if (event.dataTransfer.files.length) {
        fileInput.files = event.dataTransfer.files;
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!fileInput.files.length) {
        form.classList.add("was-validated");
        return;
      }

      statusBox.classList.remove("d-none");
      resultBox.classList.add("d-none");
      errorBox.classList.add("d-none");
      submitBtn.disabled = true;
      submitBtn.textContent = "處理中...";
      setStatus("上傳中", "正在送出檔案。");

      const formData = new FormData(form);
      try {
        const response = await fetch("/api/transcribe-audio/", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error(await readError(response, "建立請求失敗"));
        }

        const requestInfo = await response.json();
        const finishedInfo = await waitForResult(requestInfo);
        setStatus("下載中", "正在準備結果檔。");

        const downloadResponse = await fetch(finishedInfo.download_url, { cache: "no-store" });
        if (!downloadResponse.ok) {
          throw new Error(await readError(downloadResponse, "下載結果失敗"));
        }

        const blob = await downloadResponse.blob();
        const text = await blob.text();
        const ext = document.getElementById("outputFormat").value;
        const baseName = fileInput.files[0].name.replace(/\.[^.]+$/, "") || "transcript";
        const filename = `${baseName}.${ext}`;
        const url = URL.createObjectURL(new Blob([text], { type: blob.type || "text/plain;charset=utf-8" }));

        downloadLink.href = url;
        downloadLink.download = filename;
        preview.textContent = text.slice(0, 6000) + (text.length > 6000 ? "\n\n...預覽只顯示前 6000 字..." : "");
        resultBox.classList.remove("d-none");
        downloadLink.click();
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove("d-none");
      } finally {
        statusBox.classList.add("d-none");
        submitBtn.disabled = false;
        submitBtn.textContent = "開始轉譯";
      }
    });
  </script>
</body>
</html>
