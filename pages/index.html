<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音訊轉譯工具</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(13,110,253,.10), transparent 36rem),
        linear-gradient(225deg, rgba(32,201,151,.10), transparent 32rem),
        #f6f8fb;
    }
    .app-shell { max-width: 920px; }
    .hero-card {
      border: 1px solid rgba(108, 117, 125, .18);
      box-shadow: 0 1.25rem 3.5rem rgba(23, 32, 51, .12);
    }
    .language-switch { min-width: 10rem; }
    .drop-zone {
      border: 2px dashed #b8c4d6;
      background: #f9fbfe;
      transition: .2s ease;
    }
    .drop-zone:hover {
      border-color: #86b7fe;
      background: #f4f8ff;
    }
    .drop-zone.dragover {
      border-color: #0d6efd;
      background: #eef5ff;
    }
    .form-section,
    .captcha-panel {
      background: #fff;
      border: 1px solid rgba(108, 117, 125, .16);
      border-radius: .75rem;
      padding: 1.25rem;
    }
    .captcha-panel { background: #f8f9fa; }
    .captcha-img {
      max-width: 220px;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #fff;
    }
    .doc-link {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 10;
      font-size: .95rem;
    }
    pre {
      max-height: 320px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="container app-shell py-5">
    <div class="row justify-content-center">
      <div class="col-12">
        <div class="mb-4">
          <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-3">
            <span class="badge text-bg-primary" data-i18n="badge">Transcribe Tool</span>
            <div class="d-flex flex-wrap align-items-end justify-content-end gap-2">
              <a class="btn btn-outline-primary btn-sm" href="/youtube-live" data-i18n="youtubeLiveLink">YouTube 逐段轉譯</a>
              <div class="language-switch">
                <label class="form-label small text-secondary mb-1" for="languageSelect" data-i18n="languageSwitch">語系</label>
                <select id="languageSelect" class="form-select form-select-sm">
                  <option value="zh-Hant">繁體中文</option>
                  <option value="en">English</option>
                  <option value="ja">日本語</option>
                  <option value="ko">한국어</option>
                </select>
              </div>
            </div>
          </div>
          <h1 class="display-5 fw-bold text-dark mb-3" data-i18n="headline">音訊轉文字</h1>
          <p class="lead text-secondary mb-0" data-i18n="subtitle">上傳音訊，選擇格式，完成後下載結果。</p>
        </div>

        <div class="card hero-card rounded-3">
          <div class="card-body p-4 p-lg-5">
            <form id="transcribeForm" class="needs-validation" novalidate>
              <div id="dropZone" class="drop-zone rounded-3 p-4 p-lg-5 text-center mb-4 shadow-sm">
                <input class="form-control form-control-lg" id="audioFile" name="file" type="file" accept="audio/*,video/mp4,video/webm" required>
                <div class="form-text mt-3" data-i18n="fileHelp">支援常見音訊檔案。</div>
              </div>

              <div class="form-section">
                <div class="row g-3 align-items-end">
                  <div class="col-md-6">
                    <label for="outputFormat" class="form-label fw-semibold" data-i18n="outputFormat">輸出格式</label>
                    <select id="outputFormat" name="output_format" class="form-select form-select-lg">
                      <option value="txt" selected data-i18n="formatTxt">TXT 純文字</option>
                      <option value="srt" data-i18n="formatSrt">SRT 字幕</option>
                      <option value="lrc" data-i18n="formatLrc">LRC 歌詞時間軸</option>
                      <option value="json" data-i18n="formatJson">JSON 分段資料</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="language" class="form-label fw-semibold" data-i18n="languageHint">語言提示</label>
                    <select id="language" name="language" class="form-select form-select-lg">
                      <option value="" selected data-i18n="langAuto">自動偵測</option>
                      <option value="zh" data-i18n="langZh">中文</option>
                      <option value="en" data-i18n="langEn">英文</option>
                      <option value="ja" data-i18n="langJa">日文</option>
                      <option value="ko" data-i18n="langKo">韓文</option>
                    </select>
                  </div>
                </div>
              </div>

              <div id="captchaBlock" class="captcha-panel mt-4">
                <label class="form-label fw-semibold" for="captchaAnswer" data-i18n="captchaLabel">驗證碼</label>
                <div class="border rounded-3 p-3 bg-white text-center shadow-sm">
                  <img id="captchaImage" class="captcha-img rounded border" alt="驗證碼" data-i18n-alt="captchaLabel">
                </div>
                <div class="mt-3">
                  <input id="captchaId" name="captcha_id" type="hidden">
                  <input id="captchaToken" name="captcha_token" type="hidden">
                  <input id="captchaAnswer" class="form-control form-control-lg" autocomplete="off" required data-i18n-placeholder="captchaPlaceholder">
                </div>
                <div class="d-grid d-sm-flex justify-content-center gap-3 mt-3">
                  <button id="refreshCaptcha" class="btn btn-outline-secondary btn-lg px-4" type="button" data-i18n="refreshCaptcha">重新選擇</button>
                  <button id="verifyCaptcha" class="btn btn-dark btn-lg px-4" type="button" data-i18n="verifyCaptcha">驗證</button>
                </div>
                <div id="captchaStatus" class="small text-success mt-2 d-none" data-i18n="captchaVerified">驗證完成</div>
              </div>

              <div class="d-grid d-sm-flex justify-content-center gap-3 mt-4">
                <button id="submitBtn" class="btn btn-primary btn-lg px-5 d-none shadow-sm" type="submit" data-i18n="submit">開始轉譯</button>
              </div>
            </form>

            <div id="statusBox" class="alert alert-primary d-none mt-4 mb-0 shadow-sm" role="status">
              <div class="d-flex align-items-center gap-3">
                <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
                <div>
                  <strong id="statusTitle" data-i18n="statusReady">準備中</strong>
                  <div id="statusDetail" class="small" data-i18n="statusReadyDetail">請稍候，完成後會自動下載。</div>
                </div>
              </div>
            </div>

            <div id="resultBox" class="d-none mt-4">
              <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                <h2 class="h5 mb-0" data-i18n="resultTitle">轉譯完成</h2>
                <div class="d-flex flex-wrap gap-2">
                  <button id="copyResult" class="btn btn-outline-secondary shadow-sm" type="button" data-i18n="copyResult">拷貝</button>
                  <a id="downloadLink" class="btn btn-success shadow-sm" download data-i18n="downloadResult">下載結果</a>
                </div>
              </div>
              <pre id="preview" class="bg-dark text-light rounded-3 p-3 mb-0 shadow-sm"></pre>
            </div>

            <div id="errorBox" class="alert alert-danger d-none mt-4 mb-0"></div>
          </div>
          <div class="card-footer bg-white border-top px-4 px-lg-5 py-3">
            <p class="small text-secondary mb-0" data-i18n="accuracyNotice">轉譯結果可能包含辨識誤差，請在使用前檢查文字是否正確。</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <a class="doc-link btn btn-light border shadow-sm" href="/docs" data-i18n="apiDocs">API 文件</a>

        langJa: "일본어", langKo: "한국어", captchaLabel: "인증 코드", captchaPlaceholder: "이미지의 문자를 입력하세요",

        resultTitle: "전사 완료", copyResult: "복사", copyDone: "복사됨", copyFailed: "복사 실패",

        apiDocs: "API 문서", accuracyNotice: "전사 결과에는 인식 오류가 포함될 수 있습니다. 사용하기 전에 내용을 확인해 주세요.",
        captchaLoadFailed: "인증 이미지를 불러오지 못했습니다", captchaVerifyFailed: "인증에 실패했습니다",
        statusFailed: "상태를 확인하지 못했습니다", createRequestFailed: "요청을 만들지 못했습니다",
        downloadFailed: "결과를 다운로드하지 못했습니다", transcribeFailed: "전사에 실패했습니다", invalidState: "예상하지 못한 요청 상태입니다"

    let currentLanguage = localStorage.getItem(languageStorageKey) || "zh-Hant";

    function t(key) {
      return translations[currentLanguage]?.[key] || translations["zh-Hant"][key] || key;
    }

    function applyLanguage(language) {
      currentLanguage = translations[language] ? language : "zh-Hant";
      localStorage.setItem(languageStorageKey, currentLanguage);
      document.documentElement.lang = currentLanguage;
      document.title = t("pageTitle");
      languageSelect.value = currentLanguage;
      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
        element.setAttribute("placeholder", t(element.dataset.i18nPlaceholder));
      });
      document.querySelectorAll("[data-i18n-alt]").forEach(element => {
        element.setAttribute("alt", t(element.dataset.i18nAlt));
      });
    }

    function setStatusText(titleKey, detailKey) {
      statusTitle.textContent = t(titleKey);
      statusDetail.textContent = t(detailKey);
    }

    async function readError(response, fallback) {
      try {
        const data = await response.json();
        return data.detail || fallback;
      } catch (_) {
        return fallback;
      }
    }

    function resetCaptchaState() {
      captchaId.value = "";
      captchaToken.value = "";
      captchaAnswer.value = "";
      captchaAnswer.disabled = false;
      captchaBlock.classList.remove("d-none");
      captchaStatus.classList.add("d-none");
      submitBtn.classList.add("d-none");
      verifyCaptcha.disabled = false;
      refreshCaptcha.disabled = false;
      form.classList.remove("was-validated");
    }

    async function loadCaptcha() {
      resetCaptchaState();
      captchaImage.removeAttribute("src");
      const response = await fetch("/api/captcha", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(await readError(response, t("captchaLoadFailed")));
      }
      const data = await response.json();
      captchaImage.src = data.image;
      captchaId.value = data.captcha_id;
    }

    async function verifyCaptchaAnswer() {
      if (!captchaId.value || !captchaAnswer.value.trim()) {
        form.classList.add("was-validated");
        return;
      }
      verifyCaptcha.disabled = true;
      errorBox.classList.add("d-none");
      try {
        const response = await fetch("/api/captcha/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            captcha_id: captchaId.value,
            captcha_answer: captchaAnswer.value.trim()
          })
        });
        if (!response.ok) {
          throw new Error(await readError(response, t("captchaVerifyFailed")));
        }
        const data = await response.json();
        captchaToken.value = data.captcha_token;
        captchaBlock.classList.add("d-none");
        submitBtn.classList.remove("d-none");
        captchaAnswer.disabled = true;
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove("d-none");
        await loadCaptcha();
      } finally {
        verifyCaptcha.disabled = Boolean(captchaToken.value);
      }
    }

    async function waitForResult(requestInfo) {
      let current = requestInfo;
      while (current.status === "queued" || current.status === "running") {
        if (current.status === "queued") {
          setStatusText("statusQueued", "statusQueuedDetail");
        } else {
          setStatusText("statusRunning", "statusRunningDetail");
        }
        await wait(1500);
        const response = await fetch(current.status_url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(await readError(response, t("statusFailed")));
        }
        current = await response.json();
      }
      if (current.status === "failed") throw new Error(current.error || t("transcribeFailed"));
      if (current.status !== "done") throw new Error(t("invalidState"));
      return current;
    }

    ["dragenter", "dragover"].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add("dragover");
      });
    });
    ["dragleave", "drop"].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove("dragover");
      });
    });
    dropZone.addEventListener("drop", event => {
      if (event.dataTransfer.files.length) fileInput.files = event.dataTransfer.files;
    });
    refreshCaptcha.addEventListener("click", async () => {
      try {
        await loadCaptcha();
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove("d-none");
      }
    });
    verifyCaptcha.addEventListener("click", verifyCaptchaAnswer);
    languageSelect.addEventListener("change", () => applyLanguage(languageSelect.value));
    copyResult.addEventListener("click", async () => {
      if (!latestResultText) return;
      const originalText = copyResult.textContent;
      try {
        await navigator.clipboard.writeText(latestResultText);
        copyResult.textContent = t("copyDone");
        setTimeout(() => {
          copyResult.textContent = t("copyResult");
        }, 1600);
      } catch (_) {
        copyResult.textContent = t("copyFailed");
        setTimeout(() => {
          copyResult.textContent = originalText || t("copyResult");
        }, 1600);
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (!fileInput.files.length || !captchaToken.value) {
        form.classList.add("was-validated");
        return;
      }
      statusBox.classList.remove("d-none");
      resultBox.classList.add("d-none");
      errorBox.classList.add("d-none");
      submitBtn.disabled = true;
      submitBtn.textContent = t("processing");
      setStatusText("statusUploading", "statusUploadingDetail");
      const formData = new FormData(form);
      try {
        const response = await fetch("/api/transcribe-audio/", { method: "POST", body: formData });
        if (!response.ok) throw new Error(await readError(response, t("createRequestFailed")));
        const requestInfo = await response.json();
        const finishedInfo = await waitForResult(requestInfo);
        setStatusText("statusDownloading", "statusDownloadingDetail");
        const downloadResponse = await fetch(finishedInfo.download_url, { cache: "no-store" });
        if (!downloadResponse.ok) throw new Error(await readError(downloadResponse, t("downloadFailed")));
        const blob = await downloadResponse.blob();
        const text = await blob.text();
        latestResultText = text;
        const ext = document.getElementById("outputFormat").value;
        const baseName = fileInput.files[0].name.replace(/\.[^.]+$/, "") || "transcript";
        const filename = `${baseName}.${ext}`;
        const url = URL.createObjectURL(new Blob([text], { type: blob.type || "text/plain;charset=utf-8" }));
        downloadLink.href = url;
        downloadLink.download = filename;
        preview.textContent = text.slice(0, 6000) + (text.length > 6000 ? `\n\n...${t("previewTruncated")}...` : "");
        resultBox.classList.remove("d-none");
        loadCaptcha().catch(() => {});
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove("d-none");
        loadCaptcha().catch(() => {});
      } finally {
        statusBox.classList.add("d-none");
        submitBtn.disabled = false;
        submitBtn.textContent = t("submit");
      }
    });

    applyLanguage(currentLanguage);
    loadCaptcha().catch(error => {
      errorBox.textContent = error.message;
      errorBox.classList.remove("d-none");
    });
  </script>
</body>
</html>
