<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聯絡我們 - Audio IO</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      font-family: "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fb;
      color: #172033;
    }
    .page-shell { max-width: 900px; }
    .language-switch {
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .language-switch .form-label { white-space: nowrap; }
    .language-switch .form-select { min-width: 9rem; }
    .site-navbar {
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid rgba(108, 117, 125, .18);
      backdrop-filter: blur(14px);
    }
    .content-card {
      border: 1px solid rgba(108, 117, 125, .18);
      border-radius: .75rem;
      box-shadow: 0 1.25rem 3.5rem rgba(23, 32, 51, .10);
    }
    .contact-box {
      border: 1px solid rgba(108, 117, 125, .18);
      border-radius: .75rem;
      background: #f8fafc;
    }
    .site-footer a { color: #5f6b7a; text-decoration: none; }
    .site-footer a:hover { color: #0d6efd; text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="navbar site-navbar">
    <div class="container page-shell">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/">
        <img src="/favicon.svg" alt="" width="28" height="28">
        <span>Audio IO</span>
      </a>
      <div class="d-flex flex-wrap align-items-center justify-content-end gap-3">
        <div class="language-switch">
          <label class="form-label small text-secondary mb-0" for="languageSelect" data-i18n="languageSwitch">語系</label>
          <select id="languageSelect" class="form-select form-select-sm">
            <option value="zh-Hant">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <a class="btn btn-outline-primary btn-sm" href="/" data-i18n="homeLink">回到首頁</a>
      </div>
    </div>
  </nav>

  <main class="container page-shell py-4 py-lg-5">
    <article class="content-card bg-white p-4 p-lg-5">
      <p class="text-secondary fw-semibold mb-2" data-i18n="eyebrow">Contact</p>
      <h1 class="h2 fw-bold mb-4" data-i18n="heading">聯絡我們</h1>
      <p data-i18n="intro">如果你有服務問題、資料處理疑問、隱私權請求或功能建議，可以到 GitHub feedback 頁面留言或建立 Issue。</p>

      <div class="contact-box p-3 p-lg-4 my-4">
        <div class="small text-secondary mb-1" data-i18n="contactLabel">GitHub Feedback</div>
        <a class="fs-5 fw-semibold" href="https://github.com/billlin0904/audioio-feedback/" target="_blank" rel="noopener noreferrer">billlin0904/audioio-feedback</a>
      </div>

      <h2 class="h5 fw-bold mt-4" data-i18n="infoHeading">聯絡時可附上的資訊</h2>
      <ul>
        <li data-i18n="info1">問題發生時間與你使用的功能。</li>
        <li data-i18n="info2">錯誤訊息截圖或文字。</li>
        <li data-i18n="info3">若是資料刪除請求，請提供相關請求時間與可協助辨識的資訊；請不要寄送敏感錄音內容。</li>
      </ul>
    </article>
  </main>

  <footer class="site-footer container page-shell pb-5">
    <div class="d-flex flex-wrap align-items-center justify-content-center gap-3 small">
      <a href="/about" data-i18n="aboutLink">關於我們</a>
      <a href="/privacy" data-i18n="privacyLink">隱私權政策</a>
      <a href="/terms" data-i18n="termsLink">使用條款</a>
      <a href="/contact" data-i18n="contactLink">聯絡我們</a>
    </div>
  </footer>
  <script src="/legal_i18n.js" data-page="contact"></script>
</body>
</html>
