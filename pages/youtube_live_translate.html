<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Translate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --soft: #f5f7fb;
      --brand: #1463ff;
      --translation: #087e8b;
      --danger: #c4322b;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #f8faff 0%, #eef2f8 100%);
      color: var(--ink);
      font-family: "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--brand);
      display: grid;
      place-items: center;
      box-shadow: 0 14px 34px rgba(20, 99, 255, .24);
    }
    .brand-mark img { width: 22px; height: 22px; }
    .panel {
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 22px 60px rgba(32, 42, 68, .08);
    }
    .workspace-panel { overflow: hidden; }
    .input-panel { padding: 22px; }
    .result-panel { border-top: 1px solid var(--line); }
    .form-control,
    .form-select,
    .btn { border-radius: 8px; }
    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      font-weight: 700;
    }
    .start-button {
      min-height: 48px;
      white-space: nowrap;
    }
    .language-confirmation {
      margin: 22px -22px 0;
      padding: 18px 22px;
      border-top: 1px solid #cbd8ee;
      border-bottom: 1px solid #cbd8ee;
      background: #f1f6ff;
    }
    .language-confirmation-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(210px, 300px) auto;
      align-items: end;
      gap: 16px;
    }
    .language-detection-label {
      margin-bottom: 4px;
      color: #42526b;
      font-size: .78rem;
      font-weight: 800;
    }
    .language-detection-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 800;
    }
    .confidence-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 8px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #d9f7e8;
      color: #087443;
      font-size: .78rem;
      font-weight: 800;
    }
    .confidence-badge.medium {
      background: #fff1cc;
      color: #8a5700;
    }
    .confidence-badge.low {
      background: #ffe1df;
      color: #a8241d;
    }
    .status-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      color: var(--muted);
    }
    .video-drop-zone {
      position: relative;
      display: grid;
      min-height: 132px;
      place-content: center;
      gap: 6px;
      padding: 22px;
      border: 2px dashed #a8b7d0;
      border-radius: 8px;
      background: #f8faff;
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease;
    }
    .video-drop-input {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      cursor: pointer;
      opacity: 0;
    }
    .video-drop-zone:hover,
    .video-drop-zone:focus-within,
    .video-drop-zone.dragging {
      border-color: var(--brand);
      outline: 0;
      background: #eef4ff;
      box-shadow: 0 0 0 3px rgba(20, 99, 255, .12);
    }
    .video-drop-zone.disabled {
      cursor: not-allowed;
      opacity: .62;
    }
    .video-drop-zone.disabled .video-drop-input { cursor: not-allowed; }
    .video-drop-title {
      font-size: 1rem;
      font-weight: 800;
    }
    .video-drop-action {
      color: var(--brand);
      font-size: .86rem;
      font-weight: 700;
    }
    .playlist-panel {
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }
    .playlist-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .playlist-heading-title {
      min-width: 0;
      overflow: hidden;
      font-size: .9rem;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .playlist-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
    }
    .playlist-status {
      padding: 18px 14px;
      color: var(--muted);
      font-size: .86rem;
      text-align: center;
    }
    .playlist-items {
      display: grid;
      grid-auto-columns: minmax(176px, 22%);
      grid-auto-flow: column;
      gap: 10px;
      padding: 12px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: inline mandatory;
      scrollbar-gutter: stable;
    }
    .playlist-video {
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      scroll-snap-align: start;
    }
    .playlist-video:hover,
    .playlist-video:focus-visible {
      border-color: #8fb4ff;
    }
    .playlist-video.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(20, 99, 255, .12);
    }
    .playlist-thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }
    .playlist-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .playlist-duration {
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, .82);
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
    }
    .playlist-video-copy {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 7px;
      padding: 9px;
    }
    .playlist-index {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
    }
    .playlist-video-title {
      display: -webkit-box;
      min-height: 2.5em;
      overflow: hidden;
      font-size: .76rem;
      font-weight: 700;
      line-height: 1.25;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .upload-file-thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }
    .upload-file-thumbnail video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .upload-file-status {
      position: absolute;
      right: 6px;
      bottom: 6px;
      max-width: calc(100% - 12px);
      padding: 2px 5px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(0, 0, 0, .82);
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-file-progress {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 4px;
      overflow: hidden;
      background: rgba(255, 255, 255, .28);
    }
    .upload-file-progress span {
      display: block;
      width: 0;
      height: 100%;
      background: #4da3ff;
      transition: width .16s linear;
    }
    .upload-batch-downloads {
      padding: 18px 20px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }
    .upload-download-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .upload-download-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .upload-download-name {
      min-width: 0;
      overflow: hidden;
      font-size: .86rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: #9aa4b2;
    }
    .status-dot.running {
      background: #12b76a;
      box-shadow: 0 0 0 6px rgba(18, 183, 106, .14);
    }
    .status-dot.failed { background: #f04438; }
    .video-meta {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: var(--muted);
    }
    .captcha-panel {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }
    .video-preview {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .video-preview-frame {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    .video-fullscreen-button {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      border-color: rgba(255, 255, 255, .42);
      background: rgba(5, 5, 5, .78);
      color: #fff;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .24);
    }
    .video-fullscreen-button:hover,
    .video-fullscreen-button:focus-visible {
      border-color: rgba(255, 255, 255, .8);
      background: #111;
      color: #fff;
    }
    .video-player-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .video-player-layer {
      position: absolute;
      inset: 0;
    }
    .video-player-layer > div,
    .video-player-layer iframe,
    .video-player-layer video {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-player-layer video {
      display: block;
      object-fit: contain;
      background: #000;
    }
    .video-subtitle-overlay {
      min-height: 104px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 16px 5%;
      border-top: 1px solid rgba(255, 255, 255, .16);
      background: #050505;
      text-align: center;
    }
    .video-subtitle-source,
    .video-subtitle-translation {
      max-width: 100%;
      color: #fff;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }
    .video-subtitle-source {
      min-height: 1.25rem;
      font-size: .84rem;
    }
    .video-subtitle-translation {
      font-size: 1.08rem;
      font-weight: 700;
    }
    .video-subtitle-overlay.waiting .video-subtitle-translation {
      color: #98a2b3;
      font-size: .94rem;
      font-weight: 500;
    }
    .video-subtitle-overlay.error .video-subtitle-translation {
      color: #fda29b;
      font-size: .94rem;
      font-weight: 700;
    }
    .video-preview-frame:fullscreen,
    .video-preview-frame:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      background: #000;
    }
    .video-preview-frame:fullscreen .video-player-viewport,
    .video-preview-frame:-webkit-full-screen .video-player-viewport {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
    }
    .video-preview-frame:fullscreen .video-subtitle-overlay,
    .video-preview-frame:-webkit-full-screen .video-subtitle-overlay {
      position: absolute;
      right: 5%;
      bottom: 7%;
      left: 5%;
      z-index: 10;
      width: auto;
      min-height: 0;
      padding: 12px 20px;
      border: 0;
      border-radius: 6px;
      background: rgba(0, 0, 0, .78);
      pointer-events: none;
    }
    .video-preview-frame:fullscreen .video-subtitle-source,
    .video-preview-frame:-webkit-full-screen .video-subtitle-source {
      font-size: 1rem;
    }
    .video-preview-frame:fullscreen .video-subtitle-translation,
    .video-preview-frame:-webkit-full-screen .video-subtitle-translation {
      font-size: 1.25rem;
    }
    .captcha-img {
      width: min(220px, 100%);
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #fff;
    }
    .result-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }
    .progress-block {
      display: grid;
      gap: 10px;
      min-width: 0;
    }
    .live-partial-transcript {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-height: 1.4rem;
      color: #344054;
      font-size: .9rem;
      line-height: 1.5;
    }
    .live-partial-transcript::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--brand);
      content: "";
      animation: partial-pulse 1.2s ease-in-out infinite;
    }
    .live-partial-label { color: #667085; }
    .live-partial-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    @keyframes partial-pulse {
      50% { opacity: .3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .live-partial-transcript::before { animation: none; }
    }
    .progress { height: 10px; }
    .translation-progress .progress-bar { background: var(--translation); }
    .segment-list {
      display: grid;
      gap: 12px;
      padding: 18px;
      max-height: min(60vh, 620px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }
    .segment-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .segment-card.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(20, 99, 255, .12);
    }
    .segment-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #e8ecf2;
      background: #f8fafc;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
    }
    .segment-time {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .segment-time:hover,
    .segment-time:focus-visible {
      color: var(--brand);
      text-decoration: underline;
    }
    .segment-copy {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }
    .copy-column {
      min-width: 0;
      padding: 14px;
    }
    .copy-column + .copy-column { border-top: 1px solid #e8ecf2; }
    .copy-label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .translation-column .copy-label,
    .translation-text.ready { color: var(--translation); }
    .copy-text {
      margin: 0;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .translation-text.pending { color: #8a94a6; }
    .translation-text.failed { color: var(--danger); }
    .empty-state {
      min-height: 220px;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }
    .action-bar {
      padding: 18px 20px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }
    .site-footer a {
      color: #5f6b7a;
      text-decoration: none;
    }
    .site-footer a:hover {
      color: var(--brand);
      text-decoration: underline;
    }
    body.embedded { background: transparent; }
    body.embedded .shell {
      width: 100%;
      padding: 0;
    }
    body.embedded .topbar,
    body.embedded .site-footer { display: none; }
    body.embedded .panel { box-shadow: none; }
    @media (max-width: 720px) {
      .shell { padding: 24px 12px 48px; }
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .input-panel { padding: 16px; }
      .language-confirmation {
        margin-right: -16px;
        margin-left: -16px;
        padding: 16px;
      }
      .language-confirmation-grid { grid-template-columns: 1fr; }
      .progress-grid { grid-template-columns: 1fr; }
      .segment-list { max-height: 56vh; }
      .playlist-items { grid-auto-columns: minmax(190px, 76%); }
      .upload-download-item { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a id="topBrand" class="brand" href="/youtube-live-translate">
        <span class="brand-mark"><img src="/favicon.svg" alt=""></span>
        <span data-i18n="pageTitle">Video Translate</span>
      </a>
      <a id="transcribeOnlyLink" class="btn btn-outline-secondary btn-sm" href="/youtube-live" data-i18n="transcribeOnly">僅轉譯</a>
    </div>

    <section class="panel workspace-panel">
      <div class="input-panel">
      <form id="translateForm" class="row g-3 align-items-end">
        <div id="youtubeSourceGroup" class="col-12">
          <label class="form-label fw-semibold" for="youtubeUrl" data-i18n="urlLabel">YouTube 網址</label>
          <input id="youtubeUrl" class="form-control form-control-lg" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
          <section id="playlistPanel" class="playlist-panel d-none" aria-live="polite">
            <div class="playlist-heading">
              <div id="playlistTitle" class="playlist-heading-title" data-i18n="playlistLabel">播放清單</div>
              <div id="playlistCount" class="playlist-count"></div>
            </div>
            <div id="playlistStatus" class="playlist-status" data-i18n="playlistLoading">正在讀取播放清單…</div>
            <div id="playlistItems" class="playlist-items d-none"></div>
          </section>
          <div class="form-check mt-3">
            <input id="ignoreSubtitles" class="form-check-input" type="checkbox" checked>
            <label class="form-check-label" for="ignoreSubtitles" data-i18n="ignoreSubtitles">忽略內建字幕</label>
          </div>
        </div>
        <div id="uploadSourceGroup" class="col-12 d-none">
          <label class="form-label fw-semibold" for="videoFile" data-i18n="videoFileLabel">選擇影片</label>
          <div id="videoDropZone" class="video-drop-zone">
            <input id="videoFile" class="video-drop-input" type="file" accept="video/*,.avi,.m4v,.mkv,.mov,.mpeg,.mpg,.ts,.webm,.wmv" aria-describedby="videoFileHelp" multiple disabled>
            <span class="video-drop-title" data-i18n="dropVideos">拖曳影片到這裡</span>
            <span class="video-drop-action" data-i18n="dropVideosBrowse">或點擊選擇影片</span>
          </div>
          <div id="videoFileHelp" class="form-text mt-2" data-i18n="videoFileHelp">一次最多選擇 10 支影片；檔案只用於本次轉譯，完成、取消或逾時後會自動清除。</div>
          <section id="uploadFilePanel" class="playlist-panel d-none mt-3" aria-live="polite">
            <div class="playlist-heading">
              <div class="playlist-heading-title" data-i18n="selectedVideos">已選影片</div>
              <div id="uploadFileCount" class="playlist-count"></div>
            </div>
            <div id="uploadFileItems" class="playlist-items"></div>
          </section>
          <a class="small fw-semibold d-inline-block mt-2" href="/privacy" data-i18n="uploadPrivacyLink">查看隱私權政策</a>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input id="includeWordTimestamps" class="form-check-input" type="checkbox" checked>
            <label class="form-check-label" for="includeWordTimestamps" data-i18n="includeWordTimestamps">逐字顯示原文</label>
          </div>
          <div class="form-check mt-2 d-none">
            <input id="speakerDiarization" class="form-check-input" type="checkbox" disabled>
            <label class="form-check-label fw-semibold" for="speakerDiarization" data-i18n="speakerDiarization">講者辨識（Batch 測試）</label>
          </div>
          <div class="form-text d-none" data-i18n="speakerDiarizationHelp">適合訪談與會議；啟用後會略過內建字幕，完成一批音訊後才顯示講者分段。</div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <label class="form-label fw-semibold" for="sourceLanguage" data-i18n="sourceLanguage">原文語言</label>
          <select id="sourceLanguage" class="form-select form-select-lg">
            <option value="" data-i18n="autoDetect">自動偵測</option>
            <option value="en" data-i18n="languageEnglish">英文</option>
            <option value="ja" data-i18n="languageJapanese">日文</option>
            <option value="ko" data-i18n="languageKorean">韓文</option>
            <option value="th" data-i18n="languageThai">泰文</option>
            <option value="zh-TW" data-i18n="languageTraditionalChinese">繁體中文</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <label class="form-label fw-semibold" for="targetLanguage" data-i18n="targetLanguage">翻譯目標語言</label>
          <select id="targetLanguage" class="form-select form-select-lg">
            <option value="zh-TW" data-i18n="languageTraditionalChinese">繁體中文</option>
            <option value="en" data-i18n="languageEnglish">英文</option>
            <option value="ja" data-i18n="languageJapanese">日文</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <label class="form-label fw-semibold" for="translationType" data-i18n="translationType">翻譯類型</label>
          <select id="translationType" class="form-select form-select-lg">
            <option value="standard" data-i18n="translationTypeStd">Standard（GPT-OSS 120B）</option>
            <option value="premium" data-i18n="translationTypePro">Premium（Gemini）</option>
            <option value="private" data-i18n="translationTypePrivate">Private（Qwen3 14B）</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <label class="form-label fw-semibold" for="transcriptionMode" data-i18n="transcriptionMode">轉譯模式</label>
          <select id="transcriptionMode" class="form-select form-select-lg">
            <option value="accurate" data-i18n="modeAccurate">高精度（較慢）</option>
            <option value="fast" data-i18n="modeFast">快速</option>
          </select>
        </div>
        <div class="col-12 col-md-6 col-xl-3 d-grid">
          <button id="startBtn" class="btn btn-primary btn-lg start-button" type="submit" data-i18n="detectLanguage">偵測語言</button>
        </div>
      </form>

      <section id="languageConfirmation" class="language-confirmation d-none" aria-live="polite">
        <div class="language-confirmation-grid">
          <div>
            <div class="language-detection-label" data-i18n="detectedLanguageLabel">偵測結果</div>
            <p id="detectedLanguageTitle" class="language-detection-title">—</p>
            <span id="languageConfidence" class="confidence-badge">—</span>
          </div>
          <div>
            <label class="form-label fw-semibold" for="confirmedSourceLanguage" data-i18n="confirmSourceLanguage">確認原文語言</label>
            <select id="confirmedSourceLanguage" class="form-select">
              <option value="auto" data-i18n="autoDetect">自動偵測（支援混合語言）</option>
              <option value="en" data-i18n="languageEnglish">英文</option>
              <option value="ja" data-i18n="languageJapanese">日文</option>
              <option value="ko" data-i18n="languageKorean">韓文</option>
              <option value="th" data-i18n="languageThai">泰文</option>
              <option value="zh-TW" data-i18n="languageTraditionalChinese">繁體中文</option>
            </select>
          </div>
          <button id="confirmLanguageBtn" class="btn btn-primary" type="button" data-i18n="confirmAndStart">確認並開始</button>
        </div>
      </section>

      <div id="captchaBlock" class="captcha-panel d-none">
        <label class="form-label fw-semibold" for="captchaAnswer" data-i18n="captchaLabel">驗證碼</label>
        <div class="border rounded-3 p-3 bg-white text-center shadow-sm">
          <img id="captchaImage" class="captcha-img rounded border" alt="驗證碼" data-i18n-alt="captchaLabel">
        </div>
        <input id="captchaId" type="hidden">
        <input id="captchaToken" type="hidden">
        <div class="mt-3">
          <input id="captchaAnswer" class="form-control form-control-lg" autocomplete="off" data-i18n-placeholder="captchaPlaceholder">
        </div>
        <div class="d-grid d-sm-flex justify-content-center gap-3 mt-3">
          <button id="refreshCaptcha" class="btn btn-outline-secondary btn-lg px-4" type="button" data-i18n="refreshCaptcha">重新選擇</button>
          <button id="verifyCaptcha" class="btn btn-dark btn-lg px-4" type="button" data-i18n="verifyCaptcha">驗證</button>
        </div>
        <div id="captchaStatus" class="small text-success mt-2 d-none" data-i18n="captchaVerified">驗證完成</div>
      </div>

      <div class="status-strip mt-4">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText" data-i18n="waiting">等待輸入網址</span>
        <button id="cancelJob" class="btn btn-outline-danger btn-sm ms-auto d-none" type="button" data-i18n="cancelJob">取消轉譯</button>
      </div>

      <div id="videoMeta" class="video-meta mt-3 d-none">
        <div class="fw-bold text-dark" id="videoTitle"></div>
        <div class="small mt-1" id="videoDetail"></div>
      </div>

      <div id="videoPreview" class="video-preview d-none">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
          <div class="fw-bold" data-i18n="videoPreview">影片預覽</div>
          <div class="form-check form-switch mb-0">
            <input id="showSourceSubtitles" class="form-check-input" type="checkbox" role="switch" checked>
            <label class="form-check-label small" for="showSourceSubtitles" data-i18n="showSourceSubtitles">顯示原始逐字稿</label>
          </div>
        </div>
        <div id="videoPreviewFrame" class="video-preview-frame">
          <button id="videoFullscreenButton" class="video-fullscreen-button btn btn-sm" type="button" data-i18n="enterFullscreen">全螢幕</button>
          <div class="video-player-viewport">
            <div id="videoPlayerLayer" class="video-player-layer">
              <div id="youtubePlayer"></div>
            </div>
          </div>
          <div id="videoSubtitleOverlay" class="video-subtitle-overlay waiting" aria-live="polite">
            <div id="videoSubtitleSource" class="video-subtitle-source"></div>
            <div id="videoSubtitleTranslation" class="video-subtitle-translation" data-i18n="subtitleWaiting">字幕完成後會顯示在這裡</div>
          </div>
        </div>
      </div>
      </div>

      <div id="resultPanel" class="result-panel d-none">
      <div class="result-head d-flex flex-wrap align-items-center justify-content-between gap-2">
        <h1 class="h5 mb-0" data-i18n="resultTitle">即時字幕</h1>
        <span id="segmentCount" class="small text-secondary">0</span>
      </div>

      <div id="progressGrid" class="progress-grid d-none">
        <div class="progress-block">
          <div class="d-flex justify-content-between gap-3">
            <span class="fw-bold" data-i18n="transcriptionProgress">轉譯進度</span>
            <span id="transcriptionPercent" class="text-secondary fw-semibold">0%</span>
          </div>
          <div class="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div id="transcriptionBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
          </div>
          <div id="transcriptionDetail" class="small text-secondary" data-i18n="progressDetail">取得影片長度後會顯示轉譯進度。</div>
          <div id="livePartialTranscript" class="live-partial-transcript d-none" aria-live="polite">
            <span class="live-partial-label" data-i18n="recognizingNow">辨識中</span>
            <span id="livePartialText" class="live-partial-text"></span>
          </div>
        </div>
        <div class="progress-block translation-progress">
          <div class="d-flex justify-content-between gap-3">
            <span class="fw-bold" data-i18n="translationProgress">翻譯進度</span>
            <span id="translationPercent" class="text-secondary fw-semibold">—</span>
          </div>
          <div class="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div id="translationBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
          </div>
          <div id="translationDetail" class="small text-secondary" data-i18n="translationWaiting">等待轉譯內容。</div>
        </div>
      </div>

      <div id="segmentList" class="segment-list">
        <div id="emptyState" class="empty-state" data-i18n="emptyState">原文與譯文會一段一段顯示在這裡。</div>
      </div>

      <div id="actionBar" class="action-bar d-none">
        <div class="d-grid d-lg-flex justify-content-center gap-2">
          <button id="downloadSourceSrt" class="btn btn-outline-primary" type="button" data-i18n="downloadSourceSrt">下載原始 SRT</button>
          <button id="downloadTranslatedSrt" class="btn btn-outline-primary" type="button" data-i18n="downloadTranslatedSrt">下載翻譯 SRT</button>
          <button id="downloadBilingualSrt" class="btn btn-primary" type="button" data-i18n="downloadBilingualSrt">下載雙語 SRT</button>
          <button id="downloadSegmentsJson" class="btn btn-outline-secondary" type="button" data-i18n="downloadJson">下載 segments JSON</button>
          <button id="nextTranscription" class="btn btn-outline-secondary" type="button" data-i18n="nextTranscription">下一個轉譯內容</button>
        </div>
      </div>
      <div id="uploadBatchDownloads" class="upload-batch-downloads d-none">
        <div class="fw-bold" data-i18n="batchDownloads">批次下載</div>
        <div id="uploadDownloadList" class="upload-download-list"></div>
      </div>
      </div>
    </section>
  </main>
